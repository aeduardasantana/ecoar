name: Validar e publicar ECOAR na Locaweb

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecoar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar SEO, arquivos, rotas e CTAs
        run: python3 scripts/validate_site.py

  publicar:
    if: github.event_name != 'pull_request'
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Conferir segredos da Locaweb
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASS: ${{ secrets.PASS }}
        run: |
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$FTP_PASS" || (echo "HOST, USER ou PASS nao configurados" && exit 1)
      - name: Instalar cliente de publicacao
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
      - name: Enviar somente o site ECOAR
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASS: ${{ secrets.PASS }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set cmd:fail-exit true;
            set ftp:passive-mode true;
            set ftp:ssl-allow yes;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --no-perms ./site/ ./public_html/ecoar/;
            bye;
          "
